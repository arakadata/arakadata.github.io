<!DOCTYPE html>
<html>
<body style="background:black;color:#00ff88;font-family:monospace;text-align:center;padding-top:100px;">
<h1>ARAKADATA LOGIN</h1>
<input id="u" placeholder="Username"><br><br>
<input id="p" type="password" placeholder="Password"><br><br>
<button onclick="log()">LOGIN</button>
<p id="m"></p>
<script>
function log(){
var user=document.getElementById('u').value;
var pass=document.getElementById('p').value;
if(user=='kurt pogi' && pass=='Hulaanmo'){
document.getElementById('m').innerHTML='Success! Welcome!';
window.location.href='https://arakadata.github.io';
}else{
document.getElementById('m').innerHTML='Mali!';
}
}
</script>
</body>
</html>
